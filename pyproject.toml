[build-system]
requires = ["setuptools~=75.1"]
build-backend = "setuptools.build_meta"

[project]
name         = "my-smart-homes-frontend-enterprise-wing"
version      = "20250221.0"
license      = {text = "Apache-2.0"}
description  = "The My Smart Homes Frontend"
readme       = "README.md"
authors      = [
    {name = "The Home Assistant Authors", email = "hello@home-assistant.io"}
]
requires-python = ">=3.13.0"

[project.urls]
"Homepage" = "https://github.com/my-smart-homes/frontend-ha/"

[tool.setuptools]
platforms = ["any"]
zip-safe  = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["hass_frontend*"]
